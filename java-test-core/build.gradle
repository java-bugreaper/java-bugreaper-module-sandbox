plugins {
    id 'java'
    id 'io.qameta.allure' version '3.0.1' //https://plugins.gradle.org/plugin/io.qameta.allure
    id 'ru.iopump.qa.allure' version '0.1.2' //need only for DEPRECATED kochetkovma/allure-server!!!

}

//java {
//    sourceCompatibility = JavaVersion.VERSION_17
//    targetCompatibility = JavaVersion.VERSION_17
//}

repositories {

    //mavenLocal()
    mavenCentral()
}

// custom build dir for testing!
buildDir = 'my-build'

dependencies {

    implementation 'net.bugreaper:core:1.4.3'

}

test {
    useJUnitPlatform()

    systemProperties(System.getProperties())

    testLogging {
        events("PASSED", "FAILED", "SKIPPED")
        showStandardStreams = true
        exceptionFormat = "full"
    }
    test.outputs.upToDateWhen { false }
}

// for new server!

tasks.register('publishAllure') {

    doLast {

        println "Cleaning previous Allure results..."

        def cleanAllureResults = new URL(
                "http://localhost:5050/allure-docker-service/clean-results"
        ).openConnection()

        println cleanAllureResults.inputStream.text

        File resultsDir = file("$buildDir/allure-results")

        int batchSize = 100
        List<File> files = resultsDir
                .listFiles({ file -> file.isFile() } as FileFilter)
                .toList()

        println "Total files: ${files.size()}"

        files.collate(batchSize).eachWithIndex { batch, index ->

            println "Uploading batch ${index + 1}/${Math.ceil(files.size() / batchSize)} (${batch.size()} files)"

            uploadBatch(
                    batch,
                    "http://localhost:5050/allure-docker-service/send-results"
            )
        }


        println "Generating report..."

        def generate = new URL(
                "http://localhost:5050/allure-docker-service/generate-report"
        ).openConnection()

        println generate.inputStream.text
    }
}


def uploadBatch(List<File> files, String url) {

    String boundary = "----AllureBoundary${System.currentTimeMillis()}"

    HttpURLConnection conn =
            new URL(url).openConnection() as HttpURLConnection

    conn.requestMethod = "POST"
    conn.doOutput = true

    conn.setRequestProperty(
            "Content-Type",
            "multipart/form-data; boundary=${boundary}"
    )


    conn.outputStream.withCloseable { out ->

        files.each { file ->

            out << "--${boundary}\r\n"
            out << "Content-Disposition: form-data; name=\"files[]\"; filename=\"${file.name}\"\r\n"
            out << "Content-Type: ${getContentType(file)}\r\n\r\n"

            out.write(file.bytes)

            out << "\r\n"
        }


        out << "--${boundary}--\r\n"
    }


    println "Response ${conn.responseCode}"

    if (conn.responseCode >= 400) {
        println conn.errorStream?.text
        throw new GradleException("Allure upload failed")
    }
}


static String getContentType(File file) {

    if (file.name.endsWith(".json")) {
        return "application/json"
    }

    if (file.name.endsWith(".png")) {
        return "image/png"
    }

    if (file.name.endsWith(".txt")) {
        return "text/plain"
    }

    return "application/octet-stream"
}

//need only for OLD server!!!

tasks.register('allureGenReport') {
    dependsOn("allureServerGenerate")
}

allureServer {
    relativeResultDir = "$buildDir/allure-results"
    allureServerUrl = "http://localhost:8080/"

    requestToGeneration = { uuid ->
        """
            {
            "reportSpec": {
                "path": [
                    "bugreaper-sandbox-core.test-report"
                ]
            },
            "results": ["$uuid"],
            "deleteResults": true
            }
        """
    }

    gitLabCallbackEnable = false // Optional
}
