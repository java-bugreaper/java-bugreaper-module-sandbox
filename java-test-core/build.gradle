plugins {
    id("java-library")
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    mavenLocal()
}

def allureVersion = "2.27.0"

dependencies {

    implementation 'io.gitlab.ambu550:bugreaper-core:0.0.5'

}

test {
    useJUnitPlatform()

    systemProperties(System.getProperties())

    testLogging {
        events("PASSED", "FAILED", "SKIPPED")
        showStandardStreams = true
        exceptionFormat = "full"
    }

    test.outputs.upToDateWhen { false }
}

tasks.register("all", Test) {
    useJUnitPlatform {
        includeTags("core")
    }

        systemProperties(System.getProperties())

        testLogging {
            events("PASSED", "FAILED", "SKIPPED")
            showStandardStreams = true
            exceptionFormat = "full"
        }

        test.outputs.upToDateWhen { false }

}

tasks.register("core", Test) {
    useJUnitPlatform {
        includeTags("core")
    }

    systemProperties(System.getProperties())

    testLogging {
        events("PASSED", "FAILED", "SKIPPED")
        showStandardStreams = true
        exceptionFormat = "full"
    }

    test.outputs.upToDateWhen { false }
}


task allureGenReport {
    dependsOn("allureServerGenerate")
    tasks.findByName('allureServerGenerate').mustRunAfter("all")
    tasks.findByName('allureServerGenerate').mustRunAfter("core")
}

allure {
    version = allureVersion
    aspectjweaver = true
    configuration = "implementation"
    autoconfigure = true

    useJUnit5 {
        version = allureVersion
    }
}

task testWithReport {
    dependsOn("clean")
    dependsOn("test")
    dependsOn("allureServerGenerate")
    tasks.findByName('test').mustRunAfter("clean")
    tasks.findByName('allureServerGenerate').mustRunAfter("test")
}

allureServer {
    relativeResultDir = "build/allure-results"
    allureServerUrl = "http://localhost:8080/"
    requestToGeneration = { uuid ->
        """
            {
            "reportSpec": {
                "path": [
                    "java-bugreaper-sandbox.test-report"
                ],
                "executorInfo": {
                    "name": "GitLab CI",
                    "type": "GitLab CI",
                    "buildName": "gitlab pipeline with tests running on [${System.properties['app']}] env",
                    "buildUrl": "https://gitlab.com/ambu550/java-bugreaper-sandbox/-/pipelines",
                    "reportName": "java tests"
                }
            },
            "results": ["$uuid"],
            "deleteResults": true
            }
        """
    }

    gitLabCallbackEnable = false // Optional

}


allureGitLabCallback {
    reportUrlString = 'test_override'
    gitLabMergeRequestNotesEndpointPath {
        "${-> apiUrl}/projects_override/${-> projectId}/merge_requests/${-> mrId}/notes"
    }
}
