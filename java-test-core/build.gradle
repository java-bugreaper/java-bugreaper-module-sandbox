plugins {
    id("java-library")
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenLocal()
    mavenCentral()
}

buildDir = 'my-build'

def allureVersion = "2.27.0"

dependencies {

    implementation 'net.bugreaper:core:1.2.0'

}

test {
    useJUnitPlatform()

    systemProperties(System.getProperties())

    testLogging {
        events("PASSED", "FAILED", "SKIPPED")
        showStandardStreams = true
        exceptionFormat = "full"
    }

    test.outputs.upToDateWhen { false }
}

tasks.register("all", Test) {
    useJUnitPlatform {
        includeTags("core")
    }

        systemProperties(System.getProperties())

        testLogging {
            events("PASSED", "FAILED", "SKIPPED")
            showStandardStreams = true
            exceptionFormat = "full"
        }

        test.outputs.upToDateWhen { false }

}

tasks.register("core", Test) {
    useJUnitPlatform {
        includeTags("core")
    }

    systemProperties(System.getProperties())

    testLogging {
        events("PASSED", "FAILED", "SKIPPED")
        showStandardStreams = true
        exceptionFormat = "full"
    }

    test.outputs.upToDateWhen { false }
}


task allureGenReport {
    dependsOn("allureServerGenerate")
}

allure {
    version = allureVersion
    aspectjweaver = true
    configuration = "implementation"
    autoconfigure = true
    resultsDir = file(buildDir.toString() +'/allure-results')

    useJUnit5 {
        version = allureVersion
    }
}

allureServer {
    relativeResultDir = "my-build/allure-results"
    allureServerUrl = "http://localhost:8080/"
    requestToGeneration = { uuid ->
        """
            {
            "reportSpec": {
                "path": [
                    "bugreaper-sandbox-core.test-report"
                ],
                "executorInfo": {
                    "name": "GitLab CI",
                    "type": "GitLab CI",
                    "buildName": "gitlab pipeline with tests running on [${System.properties['app']}] env",
                    "buildUrl": "https://gitlab.com/ambu550/java-bugreaper-sandbox/-/pipelines",
                    "reportName": "java tests"
                }
            },
            "results": ["$uuid"],
            "deleteResults": true
            }
        """
    }

    gitLabCallbackEnable = false // Optional

}
