version: '3.8'

services:


  mock-server:
    container_name: mock-server
    image: mockserver/mockserver:5.15.0
    environment:
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Dmockserver.watchInitializationJson=true -Dmockserver.logLevel=OFF
      TZ: "Europe/Kiev"
    ports:
      - "1080:1080"

  mariadb:
    image: mariadb:10.10 #mysql:8.0.21
    container_name: mariadb
    volumes:
      - ./configs/maria-db/01-mariadb-schema.sql:/docker-entrypoint-initdb.d/01-dump.sql
    environment:
      TZ: "Europe/Kiev"
      MYSQL_ROOT_PASSWORD: ''
      MYSQL_DATABASE: MARIA_SCHEMA
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    hostname: 'minio'
    ports:
      - "9000:9000" # MinIO API port
      - "9001:9001" # MinIO Console port
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command:  'server /data --console-address ":9001"'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  autotest-example:
    container_name: autotest-example
    image: gradle:7.6.3-jdk17
    working_dir: /app
    environment:
      - TZ=Europe/Kiev
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8
    volumes:
      - ${CI_PROJECT_DIR}:/app
    depends_on:
      minio:
        condition: service_healthy
      mock-server:
        condition: service_started
      mariadb:
        condition: service_healthy
    command: sh -c "gradle clean :java-test-part1:${TAG} -DbugreaperEnv=ci"
