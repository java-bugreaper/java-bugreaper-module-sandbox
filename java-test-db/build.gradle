plugins {
    id("java-library")
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
//    mavenLocal()
    mavenCentral()
}

def allureVersion = "2.27.0"

dependencies {
//not need but you cam use for new core
//    implementation 'net.bugreaper:-core:x.x.x'

    implementation("net.bugreaper:module-db:1.1.0")

    testImplementation 'org.postgresql:postgresql:42.7.1'
    testImplementation 'com.oracle.database.jdbc:ojdbc11:23.2.0.0'
    testImplementation 'com.microsoft.sqlserver:mssql-jdbc:12.4.2.jre11'
    testImplementation "com.mysql:mysql-connector-j:9.6.0"
    testImplementation "com.clickhouse:clickhouse-jdbc:0.9.7"
}

test {
    useJUnitPlatform()

    systemProperties(System.getProperties())

    testLogging {
        events("PASSED", "FAILED", "SKIPPED")
        showStandardStreams = true
        exceptionFormat = "full"
    }

    test.outputs.upToDateWhen { false }
}

allure {
    version = allureVersion
    aspectjweaver = true
    configuration = "implementation"
    autoconfigure = true

    useJUnit5 {
        version = allureVersion
    }
}
