plugins {
    id 'java'
    id 'io.qameta.allure' version '3.0.1' //https://plugins.gradle.org/plugin/io.qameta.allure
}

repositories {

    //mavenLocal()
    mavenCentral()
}

dependencies {

    implementation("net.bugreaper:module-rest:1.3.0")
    implementation("net.bugreaper:module-db:1.3.0")
    implementation("net.bugreaper:module-minio:1.2.7")
    implementation("net.bugreaper:module-email:1.1.0")

    implementation 'org.mariadb.jdbc:mariadb-java-client:3.5.6'

}

test {
    useJUnitPlatform()

    systemProperties(System.getProperties())

    testLogging {
        events("PASSED", "FAILED", "SKIPPED")
        showStandardStreams = true
        exceptionFormat = "full"
    }

    test.outputs.upToDateWhen { false }
}

tasks.register("passed", Test) {
    useJUnitPlatform {
        includeTags("minio")
        includeTags("rest")
        includeTags("db")
        includeTags("email")
    }

        systemProperties(System.getProperties())

        testLogging {
            events("PASSED", "FAILED", "SKIPPED")
            showStandardStreams = true
            exceptionFormat = "full"
        }

        test.outputs.upToDateWhen { false }

}

tasks.register("failed", Test) {
    useJUnitPlatform {
        includeTags("failed")
    }

    systemProperties(System.getProperties())

    testLogging {
        events("PASSED", "FAILED", "SKIPPED")
