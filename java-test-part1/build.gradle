plugins {
    id("java-library")
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    //mavenLocal()
    mavenCentral()
}

def allureVersion = "2.27.0"

dependencies {
//not need but you cam use for new core
//    implementation 'io.gitlab.ambu550:bugreaper-core:x.x.x'
    implementation("io.gitlab.ambu550:bugreaper-module-rest:0.2.3")
    implementation("io.gitlab.ambu550:bugreaper-module-db:0.2.2")
    implementation("io.gitlab.ambu550:bugreaper-module-minio:0.2.2")

    testImplementation 'org.mariadb.jdbc:mariadb-java-client:3.5.6'

}

test {
    useJUnitPlatform()

    systemProperties(System.getProperties())

    testLogging {
        events("PASSED", "FAILED", "SKIPPED")
        showStandardStreams = true
        exceptionFormat = "full"
    }

    test.outputs.upToDateWhen { false }
}

tasks.register("all", Test) {
    useJUnitPlatform {
        includeTags("minio")
        includeTags("rest")
        includeTags("db")
    }

        systemProperties(System.getProperties())

        testLogging {
            events("PASSED", "FAILED", "SKIPPED")
            showStandardStreams = true
            exceptionFormat = "full"
        }

        test.outputs.upToDateWhen { false }

}

tasks.register("failed", Test) {
    useJUnitPlatform {
        includeTags("failed")
    }

    systemProperties(System.getProperties())

    testLogging {
        events("PASSED", "FAILED", "SKIPPED")
        showStandardStreams = true
        exceptionFormat = "full"
    }

    test.outputs.upToDateWhen { false }
}

tasks.register("minio", Test) {
    useJUnitPlatform {
