modules:
  minio:
    url: http://localhost
    port: 9000
    username: admin
    password: password
    await: 500 # optional
    max-upload-file-size: 10000000 # optional
    max-download-file-size: 2048 # optional
  api:
    url: http://localhost
    port: 1080
#    username: user_1 # optional
#    password: pass123 # optional
#    token: my-token # optional more priority than base auth!
    logging: false # optional
#    max-response-ms-assert: 2000 # optional
  mocks:
    url: http://localhost
    port: 1080
    await: 500 # optional
    logging: false # optional
    enchanted-report: false # optional
  db:
    mariadb:
      url: 'jdbc:mariadb://localhost:3306'
      username: MARIA_SCHEMA
      password: maria_pass
      await: 1000 # optional

      # JDBC driver configuration
      properties: # optional
        connectTimeout: 3001
        socketTimeout: 3002

      # Hikari configuration
      hikari: # optional
        poolName: mariadb-pool
        minimumIdle: 2
        maximumPoolSize: 4
        maxLifetime: 600000
        keepAliveTime: 110000
        connectionTimeout: 10000
        validationTimeout: 9000
        idleTimeout: 10555
        leakDetectionThreshold: 0
        readOnly: false
  email:
    host: localhost
    port: 1025
    auth: true
    username: 'user'
    password: 'password123'
  mailpit:
    url: http://localhost
    port: 8025
    await: 600
