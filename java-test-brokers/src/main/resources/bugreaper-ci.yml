modules:
  artemis:
    url: tcp://artemis
    port: 61616
    username: artemis
    password: artemis-password
    await: 500 # optional
    max-consumed-messages: 5 # optional
    max-consumer-timeout: 1000 # optional
    max-call-timeout: 2000 # optional
  rabbit:
    host: rabbit
    port: 5672
    username: guest_user
    password: guest_pass
    await: 500 # optional
    max-consumed-messages: 5 # optional
    max-consumer-timeout: 1000 # optional
  kafka:
    url: kafka:9092
    await: 2000 # optional
    max-consumed-messages: 5 # optional
    max-consumer-timeout: 3000 # optional
    generate-unique-consumer: false # optional
