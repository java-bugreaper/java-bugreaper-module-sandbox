plugins {
    id 'java'
    id 'io.qameta.allure' version '3.0.1' //https://plugins.gradle.org/plugin/io.qameta.allure
}

repositories {

    //mavenLocal()
    mavenCentral()
}

dependencies {

//not need but you can use for new core
//    implementation 'net.bugreaper:core:x.x.x'

    implementation("net.bugreaper:module-artemis:1.2.4")
    implementation("net.bugreaper:module-rabbit:1.2.6")
    implementation("net.bugreaper:module-kafka:1.2.1")

}

test {
    useJUnitPlatform()

    systemProperties(System.getProperties())

    testLogging {
        events("PASSED", "FAILED", "SKIPPED")
        showStandardStreams = true
        exceptionFormat = "full"
    }
//    test.outputs.upToDateWhen { false }
}
