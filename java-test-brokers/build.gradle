plugins {
    id("java-library")
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    //mavenLocal()
    mavenCentral()
}

def allureVersion = "2.27.0"

dependencies {
//not need but you can use for new core
//    implementation 'net.bugreaper:core:x.x.x'

    implementation("net.bugreaper:module-artemis:1.2.2")
    implementation("net.bugreaper:module-rabbit:1.2.3")
    implementation("net.bugreaper:module-kafka:1.1.1")

}

test {
    useJUnitPlatform()

    systemProperties(System.getProperties())

    testLogging {
        events("PASSED", "FAILED", "SKIPPED")
        showStandardStreams = true
        exceptionFormat = "full"
    }

    test.outputs.upToDateWhen { false }
}

tasks.register("all", Test) {
    useJUnitPlatform {
        includeTags("artemis")
        includeTags("rabbit")
        includeTags("kafka")
    }

        systemProperties(System.getProperties())

        testLogging {
            events("PASSED", "FAILED", "SKIPPED")
            showStandardStreams = true
            exceptionFormat = "full"
        }

        test.outputs.upToDateWhen { false }

}

tasks.register("artemis", Test) {
    useJUnitPlatform {
        includeTags("artemis")
    }

    systemProperties(System.getProperties())

    testLogging {
        events("PASSED", "FAILED", "SKIPPED")
        showStandardStreams = true
        exceptionFormat = "full"
    }

    test.outputs.upToDateWhen { false }
}

tasks.register("rabbit", Test) {
    useJUnitPlatform {
        includeTags("rabbit")
    }

    systemProperties(System.getProperties())

    testLogging {
        events("PASSED", "FAILED", "SKIPPED")
        showStandardStreams = true
        exceptionFormat = "full"
    }

    test.outputs.upToDateWhen { false }
}

tasks.register("kafka", Test) {
    useJUnitPlatform {
        includeTags("kafka")
    }

    systemProperties(System.getProperties())

    testLogging {
        events("PASSED", "FAILED", "SKIPPED")
        showStandardStreams = true
        exceptionFormat = "full"
    }

    test.outputs.upToDateWhen { false }
}

task allureGenReport {
    dependsOn("allureServerGenerate")
}

allure {
    version = allureVersion
    aspectjweaver = true
    configuration = "implementation"
    autoconfigure = true

    useJUnit5 {
        version = allureVersion
    }
}

allureServer {
    relativeResultDir = "build/allure-results"
    allureServerUrl = "http://localhost:8080/"
    requestToGeneration = { uuid ->
        """
            {
            "reportSpec": {
                "path": [
                    "bugreaper-sandbox-brokers.test-report"
                ],
                "executorInfo": {
                    "name": "GitLab CI",
                    "type": "GitLab CI",
                    "buildName": "gitlab pipeline with tests running on [${System.properties['app']}] env",
                    "buildUrl": "https://gitlab.com/ambu550/java-bugreaper-sandbox/-/pipelines",
                    "reportName": "java tests"
                }
            },
            "results": ["$uuid"],
            "deleteResults": true
            }
        """
    }

    gitLabCallbackEnable = false // Optional

}

