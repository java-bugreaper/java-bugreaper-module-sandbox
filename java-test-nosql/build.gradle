plugins {
    id 'java'
    id 'io.qameta.allure' version '3.0.1' //https://plugins.gradle.org/plugin/io.qameta.allure
}


repositories {

    //mavenLocal()
    mavenCentral()
}

dependencies {

    implementation("net.bugreaper:module-mongodb:1.2.2")
    implementation("net.bugreaper:module-redis:1.0.3")

}

test {
    useJUnitPlatform()

    systemProperties(System.getProperties())

    testLogging {
        events("PASSED", "FAILED", "SKIPPED")
        showStandardStreams = true
        exceptionFormat = "full"
    }
//    test.outputs.upToDateWhen { false }
}