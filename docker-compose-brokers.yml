version: '3.8'

services:

  artemis:
    image: apache/activemq-artemis:2.42.0
    container_name: artemis
    ports:
      - "8161:8161"
      - "61616:61616"
    #      - "1198:1198"
    #      - "1199:1199"
    #      - "9011:9011"
    volumes:
      - ./src/test/resources/broker.xml:/var/lib/artemis-instance/etc-override/broker.xml
    restart: always
    environment:
      - TZ=Europe/Kiev
      #      - ARTEMIS_MIN_MEMORY=128M
      #      - ENABLE_JMX=true
      #      - JMX_ALLOW_REMOTE=true
      #      - JMX_HOSTNAME=0.0.0.0
      #      - JMX_PORT=1199
      #      - JMX_RMI_PORT=1198
      #      - JMX_MNG_PORT=9011
      - ARTEMIS_USERNAME=artemis
      - ARTEMIS_PASSWORD=artemis-password
    healthcheck:
      test: "curl -f http://localhost:8161/console || exit 1"
      interval: 5s
      timeout: 5s
      retries: 3

  rabbit:
    image: rabbitmq:3.8-management
    hostname: 'rabbit'
    container_name: rabbit
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest_user
      - RABBITMQ_DEFAULT_PASS=guest_pass
    restart: always
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 20s
      timeout: 20s
      retries: 3

  kafka:
    image: bitnamilegacy/kafka:3.2.3
    user: root
    container_name: kafka
    ports:
      - '9092:9092' # for internal (inside docker network)
      - '9094:9094' # for external (from localhost)
    environment:
      - KAFKA_INTER_BROKER_USER=''
      - KAFKA_INTER_BROKER_PASSWORD=''
      - ALLOW_PLAINTEXT_LISTENER=yes
      #      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - BITNAMI_DEBUG=true
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    healthcheck:
      test: "bash -c 'printf \"\" > /dev/tcp/127.0.0.1/9092; exit $$?;'"
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 30s

  ## only for local debug
  test_ui_kafka:
    image: provectuslabs/kafka-ui
    container_name: test_ui_kafka
    ports:
      - '8082:8080'
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka

  autotest-example:
    container_name: autotest-example
    image: gradle:7.6.3-jdk17
    working_dir: /app
    environment:
      - TZ=Europe/Kiev
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8
      - JAVA_TOOL_OPTIONS=-DbugreaperEnv=ci
    volumes:
      - ${CI_PROJECT_DIR}:/app
    depends_on:
      artemis:
        condition: service_healthy
      rabbit:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: sh -c "gradle clean :java-test-brokers:${TAG}"
