version: '3'
services:

  postgresql:
    image: postgres:14.1
    container_name: postgresql
    volumes:
      - ${CI_PROJECT_DIR}/configs/postre-db/01-schema.sql:/docker-entrypoint-initdb.d/01-dump.sql
    # better move to .env
    environment:
      - TZ=Europe/Kiev
      - ORACLE_PASSWORD=Oracle_secret1
      - POSTGRES_USER=alex
      - POSTGRES_PASSWORD=12345
      - POSTGRES_DB=public
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "public"]
      interval: 10s
      timeout: 5s
      retries: 5

  mssql:
    #image: bitwarden/mssql:2022.11.1
    image: mcr.microsoft.com/mssql/server:2025-RC1-ubuntu-24.04
    container_name: mssql
    # init db can be created by the DockerFile,
    # but good practice is real migrations
    # or test-helper prescript
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=mssql_pass1234567
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-Usa", "-Pmssql_pass1234567", "-Q", "select 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  oracle:
    image: gvenzl/oracle-xe:21.3.0-slim
    container_name: oracle
    volumes:
      - ${CI_PROJECT_DIR}/configs/oracle-db/01-oracle-schema.sql:/container-entrypoint-initdb.d/01-dump.sql
    environment:
      - TZ=Europe/Kiev
      - ORACLE_PASSWORD=Oracle_secret1
    ports:
      - "1521:1521"
    healthcheck:
      test: [ "CMD-SHELL", "healthcheck.sh" ]
      interval: 10s
      timeout: 5s
      retries: 5

  autotest-example:
    container_name: autotest-example
    image: gradle:7.6.3-jdk17
    working_dir: /app
    environment:
      - TZ=Europe/Kiev
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8
      - JAVA_TOOL_OPTIONS=-DbugreaperEnv=ci
    volumes:
      - ${CI_PROJECT_DIR}:/app
    depends_on:
      postgresql:
        condition: service_healthy
      mssql:
        condition: service_healthy
      oracle:
        condition: service_healthy
    command: sh -c "gradle clean :java-test-dbs:${TAG}"
